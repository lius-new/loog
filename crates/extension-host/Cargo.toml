[package]
name = "loog-extension-host"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Wasmtime component host for Loog extensions"

[dependencies]
loog-extension-api = { path = "../extension-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = { version = "=50.0.1", default-features = false, features = ["runtime", "component-model", "cranelift", "std", "wat"] }

base64 = "0.22"
ring = "0.17"

[dev-dependencies]
wit-component = "0.261"
