[package]
name = "loog-text-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Portable text decoding and bounded search rules shared by Loog consumers"
repository = "https://github.com/lius-new/loog"

[dependencies]
serde = { version = "1", features = ["derive"] }
encoding_rs = "0.8"
chardetng = "0.1.17"
regex = "1"
globset = "0.4"
unicode-segmentation = "1.13"
