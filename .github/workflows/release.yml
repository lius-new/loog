name: Release
on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      version:
        description: Existing application tag version, without v
        required: true
      publish:
        description: Upload all verified packages to a release draft
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  verify:
    name: Verify release commit and CI
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.gate.outputs.version }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version && format('refs/tags/v{0}', inputs.version) || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Require successful CI for this exact commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: node scripts/release/verify-ci.mjs
      - name: Lock the bundled extensions once for every platform
        # The newest verified extensions, signed index included; kept with the run so a
        # release can be traced to the exact index it bundled.
        run: node scripts/package/refresh-lock.mjs
      - name: Hand the lock to the platform builds
        uses: actions/upload-artifact@v7
        with:
          name: registry-lock
          path: assets/registry/
          if-no-files-found: error
          retention-days: 90
    timeout-minutes: 5
  package:
    name: Package ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            label: Linux x64
            os: ubuntu-24.04
            target: linux-x86_64
          - platform: windows
            label: Windows x64
            os: windows-2025
            target: windows-x86_64
          - platform: macos
            label: macOS universal
            os: macos-15
            target: macos-universal
    env:
      LOOG_MACOS_SIGN_IDENTITY: ${{ matrix.platform == 'macos' && secrets.MACOS_SIGN_IDENTITY || '' }}
      LOOG_MACOS_NOTARY_APPLE_ID: ${{ matrix.platform == 'macos' && secrets.MACOS_NOTARY_APPLE_ID || '' }}
      LOOG_MACOS_NOTARY_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.MACOS_NOTARY_TEAM_ID || '' }}
      LOOG_MACOS_NOTARY_PASSWORD: ${{ matrix.platform == 'macos' && secrets.MACOS_NOTARY_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Restore build inputs
        uses: ./.github/actions/dependencies
        with:
          prepare: "false"
          variant: release
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        uses: ./.github/actions/linux-build-dependencies
      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE_P12" ]]; then
            echo "::notice::No Developer ID certificate configured; packages are ad-hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/loog-signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/loog-signing.p12"
          security import "$RUNNER_TEMP/loog-signing.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/loog-signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
        if: matrix.platform == 'macos'
      - name: Take the lock the verify job made
        uses: actions/download-artifact@v7
        with:
          name: registry-lock
          path: assets/registry
      - name: Fetch the locked extensions
        run: node scripts/package/fetch-locked.mjs
      - name: Build and package once
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        run: node scripts/release/package.mjs
      - name: Build loog-ext-validate
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          # The extensions repository runs this to check its packages with the
          # loaders and query compilers the application uses. macOS runners are arm64.
          node scripts/build/cargo.mjs build --release --locked --manifest-path tools/ext-validate/Cargo.toml --bin loog-ext-validate
          case "$PLATFORM" in
            windows) built=loog-ext-validate.exe; name=loog-ext-validate-windows-x86_64.exe ;;
            linux) built=loog-ext-validate; name=loog-ext-validate-linux-x86_64 ;;
            macos) built=loog-ext-validate; name=loog-ext-validate-macos-aarch64 ;;
          esac
          cp "tools/ext-validate/target/release/$built" ".packaging/dist/$name"
      - name: Smoke test staged Windows application
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: node scripts/baseline/startup-smoke.mjs --executable ".packaging/windows/stage/Loog-$env:VERSION-windows-x86_64/Loog.exe" --output-directory "$env:RUNNER_TEMP/loog-release-smoke"
      - name: Check the .deb installs
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          deb=".packaging/dist/Loog-$VERSION-linux-x86_64.deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          sudo apt-get install --yes --no-install-recommends "./$deb"
          test -x /opt/loog/Loog
          test "$(readlink -f /usr/bin/loog)" = /opt/loog/bin/loog
          sudo apt-get remove --yes loog
          test ! -e /opt/loog
        if: matrix.platform == 'linux'
      - name: Check the .dmg
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          dmg=".packaging/dist/Loog-$VERSION-macos-universal.dmg"
          hdiutil verify "$dmg"
          mount="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          codesign --verify --deep --strict "$mount/Loog.app"
          test "$(readlink "$mount/Applications")" = /Applications
          hdiutil detach "$mount"
        if: matrix.platform == 'macos'
      - name: Write signed update manifest
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          LOOG_UPDATE_SIGNING_KEY: ${{ secrets.LOOG_UPDATE_SIGNING_KEY }}
        run: node scripts/package/package.mjs manifest --platform "$PLATFORM" --expect-version "$VERSION"
        shell: bash
      - name: Upload verified platform artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Loog-${{ needs.verify.outputs.version }}-${{ matrix.target }}
          path: |-
            .packaging/dist/Loog-${{ needs.verify.outputs.version }}-${{ matrix.target }}*
            .packaging/dist/update-${{ matrix.target }}.json
            .packaging/dist/loog-ext-validate-*
          if-no-files-found: error
      - name: Remove signing keychain
        if: ${{ always() && matrix.platform == 'macos' }}
        run: security delete-keychain "$RUNNER_TEMP/loog-signing.keychain-db" 2>/dev/null || true
  publish:
    name: Create draft and upload all platforms
    needs:
      - verify
      - package
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Download this run’s platform artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: Loog-${{ needs.verify.outputs.version }}-*
          path: dist
          merge-multiple: true
      - name: Verify complete assets, create draft and upload
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        run: node scripts/release/publish.mjs --publish-draft --version "$VERSION" --target "$RELEASE_SHA" --repo "$GITHUB_REPOSITORY" --assets dist --notes "$RUNNER_TEMP/loog-release-notes.md"
    timeout-minutes: 25
